# KongPlugin OIDC — Modo Bearer-only (API)
#
# Objetivo: validar Authorization: Bearer <token> contra o Keycloak via introspect.
# Sem token → 401. Token inválido/expirado → 401. Token válido → request passa ao backend.
#
# Importante:
# - Este recurso DEVE estar no mesmo namespace do Service alvo (mars).
#   Caso contrário a annotation `konghq.com/plugins: oidc-bearer` no HTTPRoute não resolve.
# - `client_secret` está hardcoded para PoC. Em produção: usar Kong vault (`{vault://env/...}`)
#   ou KongPlugin `configFrom.secretKeyRef`.
# - `ssl_verify: "no"` é aceitável aqui porque o tráfego Kong→Keycloak é in-cluster
#   plain HTTP. Mudar para "yes" quando o Keycloak passar a ter TLS (cert-manager).
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: oidc-bearer
  namespace: mars
plugin: oidc
config:
  # --- Identificação no Keycloak ---
  client_id: kong_dev
  client_secret: "REPLACE_ME_FROM_KEYCLOAK"   # ⚠️ Realm `mars` › Clients › kong_dev › Credentials. NÃO commitar valor real.
  # Para aplicar o valor real sem editar este ficheiro:
  #   kubectl -n mars patch kongplugin oidc-bearer --type merge \
  #     -p '{"config":{"client_secret":"<valor-real>"}}'
  realm: mars

  # --- Discovery e endpoints ---
  # IMPORTANTE: usamos o hostname Tailscale (não o svc in-cluster) porque o Keycloak
  # constrói o claim `iss` do token com base no Host header do pedido que mintou o token.
  # Bruno acede via Tailscale → token tem iss=keycloak-lab.tailf345b0.ts.net.
  # Se aqui usássemos o svc cluster, o issuer do discovery (svc) ≠ iss do token (Tailscale)
  # → plugin valida e rejeita com 401.
  #
  # Fix definitivo (futuro): definir KC_HOSTNAME fixo no Keycloak para issuer canónico
  # independente do Host do pedido. Aí podemos voltar ao svc in-cluster aqui.
  discovery: http://keycloak-lab.tailf345b0.ts.net/realms/mars/.well-known/openid-configuration
  introspection_endpoint: http://keycloak-lab.tailf345b0.ts.net/realms/mars/protocol/openid-connect/token/introspect

  # --- Modo de operação ---
  # bearer_only=yes: nunca redireciona, exige header Authorization: Bearer <token>.
  # Stateless, sem session cookie.
  bearer_only: "yes"
  introspection_endpoint_auth_method: client_secret_post
  token_endpoint_auth_method: client_secret_post

  # --- Segurança ---
  ssl_verify: "no"   # in-cluster plain HTTP — flip para "yes" quando Keycloak tiver TLS

  # --- Scope mínimo (bearer já vem com claims completos) ---
  scope: openid

  # --- Logout (não usado em bearer_only, mas o plugin schema exige) ---
  logout_path: /logout
  redirect_after_logout_uri: /
