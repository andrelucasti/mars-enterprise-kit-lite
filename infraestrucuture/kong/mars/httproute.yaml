apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: mars
  annotations:
    # Aplica o KongPlugin `oidc-bearer` (no mesmo namespace) a esta rota.
    # Sem token Bearer válido → 401 antes de chegar ao backend.
    # Observabilidade: métricas L7 do mars vêm via sidecar Istio (PodMonitor
    # `istio-sidecars`), não via Kong prometheus plugin (que é global-only).
    konghq.com/plugins: oidc-bearer,cors-orders
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kong
      namespace: kong
  rules:
    - matches:
        - path:
            value: /orders
      backendRefs:
        - name: mars-mars-enterprise-kit-lite
          port: 8082

