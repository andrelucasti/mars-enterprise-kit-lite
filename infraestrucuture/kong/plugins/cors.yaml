# KongPlugin CORS — rota `orders`
#
# Padrão observado na TML PRD (kong-atual-prd.yaml): CORS aplicado POR ROTA,
# não globalmente. Isto permite políticas distintas (front-end interno vs
# parceiro externo) sem afetar rotas server-to-server.
#
# Importante:
# - Deve estar no mesmo namespace do HTTPRoute alvo (`mars`).
# - Referenciado via annotation `konghq.com/plugins` no HTTPRoute,
#   combinada com vírgula: `konghq.com/plugins: oidc-bearer,cors-orders`.
# - `credentials: true` exige `origins` EXPLÍCITOS (não pode ser `*`) — padrão
#   CORS spec.
# - `max_age` em segundos (3600 = 1h). Reduz preflight (OPTIONS) repetidos.
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: cors-orders
  namespace: mars
plugin: cors
config:
  # Origens permitidas. PoC usa wildcards Tailscale + localhost para Bruno/dev.
  # Em produção: listar domínios exatos (ex: https://app.mars.example.com).
  origins:
    - http://localhost:3000
    - http://localhost:5173
    - https://*.tailf345b0.ts.net
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Authorization
    - Content-Type
    - Origin
    - X-Correlation-ID
    - X-Requested-With
  exposed_headers:
    - X-Correlation-ID
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
  credentials: true
  max_age: 3600
  preflight_continue: false
