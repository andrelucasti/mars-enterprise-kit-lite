apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: prometheus
  namespace: kong
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/tags: ''
  labels:
    global: 'true'
config:
  # Kong 3.x desligou por default as métricas "caras" para reduzir cardinality.
  # Para popular o dashboard 7424 (RPS, status, latência) é preciso habilitar
  # cada categoria explicitamente.
  #
  # Custo: cardinality cresce com (routes × services × status codes).
  # Em lab é OK; em produção, considere desligar `per_consumer` se houver
  # muitos consumers (cria 1 série por consumer).
  status_code_metrics: true      # kong_http_requests_total (RPS, status panels)
  latency_metrics: true          # kong_request_latency_ms, kong_upstream_latency_ms
  bandwidth_metrics: true        # kong_bandwidth_bytes
  upstream_health_metrics: true  # kong_upstream_target_health
  per_consumer: true             # adiciona label `consumer` em status_code/bandwidth
plugin: prometheus