# =============================================================================
# Application
# =============================================================================
replicaCount: 1

image:
  repository: ghcr.io/andrelucasti/mars-enterprise-kit-lite
  tag: "latest" # Defaults to Chart.appVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Service
# =============================================================================
service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

# =============================================================================
# Spring Boot Configuration
# =============================================================================
spring:
  profiles:
    active: "default"
  datasource:
    password: "mars" # Override for dev. Use existingSecret in prod.

# External Secret reference (pre-created K8s Secret with DB password)
# Set this to use a pre-existing secret instead of the chart-managed one
existingSecret: ""
existingSecretKey: "SPRING_DATASOURCE_PASSWORD"

# =============================================================================
# External Database (PostgreSQL) — NOT managed by this chart
# =============================================================================
# Provide connection details for your external PostgreSQL instance.
# Examples: AWS RDS, Cloud SQL, self-hosted PostgreSQL, etc.
externalDatabase:
  host: "100.94.93.48" # PostgreSQL hostname or IP
  port: 5432 # PostgreSQL port
  database: "mars_lite_order" # Database name
  username: "mars" # Database username

# =============================================================================
# External Kafka — NOT managed by this chart
# =============================================================================
# Provide the bootstrap servers for your external Kafka/Redpanda cluster.
# Examples: Confluent Cloud, Amazon MSK, self-hosted Kafka, Redpanda, etc.
externalKafka:
  bootstrapServers: "localhost:9092" # Comma-separated list of broker addresses

# =============================================================================
# ServiceAccount
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

# =============================================================================
# Health Probes
# =============================================================================
probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 5
    failureThreshold: 3
  startup:
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# =============================================================================
# Kong — Upstream healthchecks
# =============================================================================
# Aplica annotation `konghq.com/upstream-policy` no Service para que Kong
# faça active/passive healthcheck. A KongUpstreamPolicy referenciada deve
# existir no mesmo namespace (ver infraestrucuture/kong/mars/upstream-policy.yaml).
# Deixar vazio/comentado para desativar.
kong:
  upstreamPolicy: mars-orders

# =============================================================================
# Monitoring — Prometheus ServiceMonitor
# =============================================================================
serviceMonitor:
  enabled: true # Set to true if Prometheus Operator is installed
  interval: 30s
  scrapeTimeout: 10s
  path: /actuator/prometheus
  labels:
    release: kps # Match kube-prometheus-stack release name (best practice, even if selectors are open)

# =============================================================================
# OpenTelemetry — Auto-instrumentation
# =============================================================================
# Requires the OpenTelemetry Operator installed in the cluster.
# The annotation tells the operator to inject the Java agent automatically.
opentelemetry:
  enabled: false
  injectJava: "true" # Value for instrumentation.opentelemetry.io/inject-java annotation
  exporter:
    endpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mars-orders.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# =============================================================================
# Istio (east-west: mesh routing + mTLS interno)
# Ligar só quando o namespace estiver com sidecar injection
# (`istio-injection=enabled`) e o istiod estiver instalado.
# =============================================================================
istio:
  enabled: false

  virtualService:
    # Retry para 5xx + falhas de conexão. perTryTimeout × attempts deve
    # caber dentro do `timeout` total.
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: "5xx,reset,connect-failure,refused-stream"
    # Timeout total da request L7 vista pelo client mesh. Vazio = sem timeout.
    timeout: 10s

  destinationRule:
    # ISTIO_MUTUAL: força mTLS quando o caller também está no mesh.
    # DISABLE: plain HTTP. Usar enquanto Kong (fora do mesh) for o único caller.
    tlsMode: ISTIO_MUTUAL
    # Circuit-breaker básico. Limita pressão a montante em pico/colapso.
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
